name: Offline software tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y psmisc
          python -m venv drone_project/pi_flight/.venv
          drone_project/pi_flight/.venv/bin/python -m pip install --upgrade pip
          drone_project/pi_flight/.venv/bin/python -m pip install -r requirements-dev.txt
      - run: bash scripts/test_all.sh
